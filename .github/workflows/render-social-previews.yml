name: Render social previews
on:
  push:
    branches:
      - fix/crypto-risk-title-colon
    paths:
      - .github/workflows/render-social-previews.yml
permissions:
  contents: read
jobs:
  render:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Render cards with the existing generator
        run: node scripts/generate-og.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: social-previews
          path: public/og/*.png
          if-no-files-found: error
          retention-days: 3
