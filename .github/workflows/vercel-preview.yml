# Creates an on-demand Vercel preview for any branch in this repository.
#
# One-time setup: add VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID as
# GitHub Actions repository secrets. Then either run this workflow manually or,
# as the repository owner, comment `/vercel-preview <branch>` on an issue or PR.

name: Deploy Vercel preview

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/vercel-preview '))
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Resolve requested branch
        id: branch
        uses: actions/github-script@v7
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          DISPATCH_BRANCH: ${{ inputs.branch }}
        with:
          script: |
            const command = '/vercel-preview ';
            const rawBranch = process.env.EVENT_NAME === 'workflow_dispatch'
              ? process.env.DISPATCH_BRANCH || ''
              : (process.env.COMMENT_BODY || '').slice(command.length);
            const branch = rawBranch.trim();

            const hasSafeCharacters = /^[A-Za-z0-9._/-]+$/.test(branch);
            const hasInvalidShape = branch.startsWith('-') ||
              branch.startsWith('/') ||
              branch.endsWith('/') ||
              branch.includes('..') ||
              branch.includes('//');

            if (!hasSafeCharacters || hasInvalidShape) {
              core.setFailed('Enter a valid branch name using letters, numbers, ., _, -, or /.');
              return;
            }

            core.setOutput('name', branch);

            try {
              const { data } = await github.rest.repos.getBranch({
                ...context.repo,
                branch,
              });
              core.setOutput('sha', data.commit.sha);
            } catch (error) {
              if (error.status === 404) {
                core.setFailed(`Branch not found in this repository: ${branch}`);
                return;
              }
              throw error;
            }

      - name: Check Vercel credentials
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=()
          [[ -z "$VERCEL_TOKEN" ]] && missing+=(VERCEL_TOKEN)
          [[ -z "$VERCEL_ORG_ID" ]] && missing+=(VERCEL_ORG_ID)
          [[ -z "$VERCEL_PROJECT_ID" ]] && missing+=(VERCEL_PROJECT_ID)

          if (( ${#missing[@]} )); then
            printf 'Missing GitHub Actions secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest
        working-directory: ${{ runner.temp }}

      - name: Check out requested branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch.outputs.sha }}
          persist-credentials: false

      - name: Pull Vercel preview settings
        env:
          DEPLOY_BRANCH: ${{ steps.branch.outputs.name }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          vercel pull --yes --environment=preview --git-branch="$DEPLOY_BRANCH"
          --token="$VERCEL_TOKEN"

      - name: Deploy preview
        id: deploy
        shell: bash
        env:
          DEPLOY_BRANCH: ${{ steps.branch.outputs.name }}
          DEPLOY_SHA: ${{ steps.branch.outputs.sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          deployment_url="$(vercel deploy --yes --target=preview --archive=tgz \
            --meta githubDeployment=1 \
            --meta githubCommitOrg="$GITHUB_REPOSITORY_OWNER" \
            --meta githubCommitRepo="$repo_name" \
            --meta githubCommitRef="$DEPLOY_BRANCH" \
            --meta githubCommitSha="$DEPLOY_SHA" \
            --meta githubOrg="$GITHUB_REPOSITORY_OWNER" \
            --meta githubRepo="$repo_name" \
            --token="$VERCEL_TOKEN")"

          if [[ ! "$deployment_url" =~ ^https:// ]]; then
            echo "Vercel did not return a deployment URL." >&2
            exit 1
          fi

          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Add preview URL to workflow summary
        env:
          DEPLOY_BRANCH: ${{ steps.branch.outputs.name }}
          DEPLOY_SHA: ${{ steps.branch.outputs.sha }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          printf '## Vercel preview\n\n- Branch: `%s`\n- Commit: `%s`\n- URL: %s\n' \
            "$DEPLOY_BRANCH" "$DEPLOY_SHA" "$DEPLOYMENT_URL" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Comment with preview URL
        if: ${{ success() && github.event_name == 'issue_comment' }}
        uses: actions/github-script@v7
        env:
          DEPLOY_BRANCH: ${{ steps.branch.outputs.name }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Vercel preview ready for \`${process.env.DEPLOY_BRANCH}\`:`,
              process.env.DEPLOYMENT_URL,
              '',
              `[View workflow run](${runUrl})`,
            ].join('\n');

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Comment when deployment fails
        if: ${{ failure() && github.event_name == 'issue_comment' }}
        uses: actions/github-script@v7
        env:
          DEPLOY_BRANCH: ${{ steps.branch.outputs.name }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const requestedBranch = process.env.DEPLOY_BRANCH || 'the requested branch';
            const body = `Vercel preview failed for \`${requestedBranch}\`. [View workflow run](${runUrl}).`;

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body,
            });
